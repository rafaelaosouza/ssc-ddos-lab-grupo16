services:
  vitima:
    build: ./vitima
    container_name: vitima
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.tcp_syncookies=0
      - net.ipv4.tcp_max_syn_backlog=256
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.rp_filter=0
    volumes:
      - ./vitima/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./vitima/site:/usr/share/nginx/html:ro
      - ./vitima/firewall.nft:/etc/firewall.nft:ro
    networks:
      - labnet

  cliente:
    image: nicolaka/netshoot
    container_name: cliente
    command: sleep infinity
    networks:
      - labnet

  atacante:
    build: ./atacante
    container_name: atacante
    command: sleep infinity
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - labnet

networks:
  labnet:
    name: labnet
    driver: bridge
