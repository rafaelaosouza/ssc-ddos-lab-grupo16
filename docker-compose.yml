services:
  vitima:
    image: nginx:1.27-alpine
    container_name: vitima
    volumes:
      - ./vitima/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./vitima/site:/usr/share/nginx/html:ro
    networks:
      - labnet

  cliente:
    image: nicolaka/netshoot
    container_name: cliente
    command: sleep infinity
    networks:
      - labnet

  atacante:
    image: nicolaka/netshoot
    container_name: atacante
    command: sleep infinity
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - labnet

networks:
  labnet:
    name: labnet
    driver: bridge
